<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylitol Mint | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg brand-navbar sticky-top">
    <div class="container-xl">
      <a class="navbar-brand logo-mark" href="index.html">LOTTE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav mx-auto mb-3 mb-lg-0 gap-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#flavors">Flavors</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#benefits">Benefits</a></li>
          <li class="nav-item dropdown nav-hover-dropdown">
            <button class="nav-link dropdown-toggle" id="aboutDropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              About Us <i data-lucide="chevron-down"></i>
            </button>
            <ul class="dropdown-menu brand-dropdown" aria-labelledby="aboutDropdown">
              <li><a class="dropdown-item" href="about.html">Our Story</a></li>
              <li><a class="dropdown-item" href="about.html#team">Why Xylitol</a></li>
              <li><a class="dropdown-item" href="contact.html">Contact Us</a></li>
            </ul>
          </li>
        </ul>
        <div class="d-flex flex-column flex-sm-row gap-2">
          <a class="btn btn-brand" href="signup.html">Sign up</a>
          <a class="btn btn-light-brand active" href="signin.html">Sign In</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="container-xl">
      <div class="row align-items-center g-5">
        <div class="col-lg-6 text-center text-lg-start">
          <h1>Welcome Back</h1>
          <p>Sign in to keep your Xylitol favorites, flavor notes, and checkout preferences ready.</p>
        </div>
        <div class="col-lg-5 ms-lg-auto">
          <form class="card auth-card needs-brand-feedback">
            <div class="card-body">
              <h2>Sign In</h2>
              <p class="text-muted">Use your email and password.</p>
              <label class="form-label" for="signinEmail">Email</label>
              <input class="form-control mb-3" id="signinEmail" type="email" placeholder="you@email.com" required>
              <label class="form-label" for="signinPassword">Password</label>
              <input class="form-control mb-4" id="signinPassword" type="password" placeholder="Your password" required>
              <button class="btn btn-blue w-100" type="submit">Sign In</button>
              <div class="auth-divider"><span>or sign in with</span></div>
              <div class="d-flex justify-content-center gap-3">
                <button class="social-btn" type="button">
                  <img src="assets/Apple Logo PNG.jpg" alt="Apple login" style="width: 24px; height: 24px; object-fit: contain;">
                </button>
                <button class="social-btn google" type="button">
                  <img src="assets/google logo.jpg" alt="Google login" style="width: 24px; height: 24px; object-fit: contain;">
                </button>
                <button class="social-btn facebook" type="button">
                  <img src="assets/Facebook_Logo_Primary.png" alt="Facebook login" style="width: 24px; height: 24px; object-fit: contain;">
                </button>
              </div>
              <p class="mt-4 mb-0 text-center">New here? <a href="signup.html">Create account</a></p>
              <p class="form-response mt-3 mb-0 text-center" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
